version: "3.9"

services:
  # ── PostgreSQL Database ───────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: attrition-iq-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: attrition
      POSTGRES_PASSWORD: attrition
      POSTGRES_DB: attrition_iq
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/app/sql/01_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./backend/app/sql/03_analytics_views.sql:/docker-entrypoint-initdb.d/03_analytics_views.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U attrition -d attrition_iq"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── FastAPI Backend ───────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: attrition-iq-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://attrition:attrition@db:5432/attrition_iq
      PYTHONUNBUFFERED: "1"
    depends_on:
      db:
        condition: service_healthy

  # ── Next.js Frontend ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: attrition-iq-frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    depends_on:
      - backend

volumes:
  pgdata:
