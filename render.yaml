services:
  # ── FastAPI Backend Service ───────────────────────────────────────────────
  - type: web
    name: attrition-iq-backend
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: attrition-iq-db
          property: connectionString
      - key: PYTHONUNBUFFERED
        value: "1"

databases:
  # ── PostgreSQL Database ───────────────────────────────────────────────────
  - name: attrition-iq-db
    databaseName: attrition_iq
    user: attrition
    plan: free
    region: oregon
